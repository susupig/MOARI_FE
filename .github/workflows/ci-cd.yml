name: MOARI CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI · Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  delivery:
    name: CD · Verify and publish Docker image
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build Docker image
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: docker build --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --tag "$IMAGE" .
      - name: Start frontend and verify the HTTP response
        run: |
          docker run --detach --name moari-fe -p 127.0.0.1:8080:8080 "$IMAGE"
          curl --fail --silent --show-error --max-time 5 --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/ --output /tmp/moari-index.html
          grep -q 'id="root"' /tmp/moari-index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/ci-route --output /tmp/moari-route.html
          cmp /tmp/moari-index.html /tmp/moari-route.html
      - name: Print container logs on failure
        if: failure()
        run: docker logs moari-fe || true
      - name: Publish verified image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf 'Published `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
